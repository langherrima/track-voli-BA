name: Monitor volo MIL-BUE
on:
  schedule:
    - cron: "0 6 * * *"   # 07:00 ora italiana (UTC+1)
  workflow_dispatch:       # avvio manuale dalla tab Actions
permissions:
  contents: write
  issues: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python track_volo.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SOGLIA: "1450"
      - name: Salva storico
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add storico_prezzi.csv
          git commit -m "prezzo $(date +%F)" || true
          git push
      - name: Avviso prezzo
        if: hashFiles('ALERT.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}        
        run: |
          gh issue create --title "Volo MIL-BUE - prezzo $(date +%F)" --body-file ALERT.md
